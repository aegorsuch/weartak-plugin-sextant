# Lives on the GitHub mirror's default branch (GitHub only runs workflows from there).
# The TAK.gov publisher (ci/publish_github_release.py) sends the dispatch after it has
# verified the uploaded APK. "Run workflow" re-checks the current release by hand.
name: Release testing checklist

on:
  repository_dispatch:
    types: [sextant-release-published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-testing
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: ci/release-testing
      - name: Assign release checklist
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TESTER: ${{ vars.RELEASE_TESTER }}
        with:
          script: |
            const { createReleaseTestIssue } = require('./ci/release-testing/create_release_test_issue.cjs');
            await createReleaseTestIssue({
              github, context, core, tester: process.env.RELEASE_TESTER,
            });
